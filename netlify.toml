# ===================================================
# Site do consultorio de Bianca Leao, psicologa.
#
# Este arquivo faz o Netlify publicar a pasta dist/
# deste repositorio, sem precisar configurar nada na
# interface. Nao existe etapa de build.
#
# Dominio: biancaleao.com.br
# ===================================================

[build]
  publish = "dist"
  command = ""

# --- Seguranca -------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# --- Cache -----------------------------------------
# Imagens e pacotes nao mudam de nome: cache longo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML, CSS e JS sao revalidados a cada visita, para
# que um deploy novo apareca na hora.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Atalhos sem .html -----------------------------
[[redirects]]
  from = "/sobre"
  to = "/sobre.html"
  status = 200
[[redirects]]
  from = "/atendimento"
  to = "/atendimento.html"
  status = 200
[[redirects]]
  from = "/agendar"
  to = "/agendar.html"
  status = 200

# --- Enderecos do site de campanha ----------------
# Links antigos que circularam nos grupos levam para a
# pagina mais proxima do site novo, em vez de cair no 404.
[[redirects]]
  from = "/participe*"
  to = "/agendar.html"
  status = 301
[[redirects]]
  from = "/pautas*"
  to = "/atendimento.html"
  status = 301
[[redirects]]
  from = "/gerador*"
  to = "/"
  status = 301
[[redirects]]
  from = "/figurinhas*"
  to = "/"
  status = 301

# --- Pagina de erro --------------------------------
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
