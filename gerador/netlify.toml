# ===================================================
# Gerador de fotos da campanha Bianca Leao 4447.
#
# Segundo site do MESMO repositorio. No Netlify, crie
# um novo site apontando para o repositorio e defina:
#   Base directory:     gerador
#   Build command:      (vazio)
#   Publish directory:  gerador/dist
#
# Com a base directory definida, o Netlify le ESTE
# arquivo e ignora o netlify.toml da raiz.
#
# Dominio provisorio: gerador.biancaleao.achillesmedia.com.br
# Dominio definitivo: gerador.biancaleao.com.br
# ===================================================

[build]
  base = "gerador"
  publish = "dist"
  command = ""

# --- Seguranca -------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# A camera e usada pelo proprio site no botao "Tirar foto".

# --- Cache -----------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Pagina unica ----------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
